apiVersion: v1
kind: Service
metadata:
  name: ai-pr-agent
  namespace: ai-pr-agent
  labels:
    app.kubernetes.io/name: ai-pr-agent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ai-pr-agent
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-pr-agent
  namespace: ai-pr-agent
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-pr-agent.your-domain.com
      secretName: ai-pr-agent-tls
  rules:
    - host: ai-pr-agent.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-pr-agent
                port:
                  name: http
