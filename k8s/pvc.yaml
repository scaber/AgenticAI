apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-pr-agent-workspace
  namespace: ai-pr-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-pr-agent-index
  namespace: ai-pr-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
